<style>
  :root{
    --navy:#0F2038;
    --navy-2:#182F52;
    --navy-3:#213F6B;
    --paper:#F5F1E6;
    --paper-2:#EEE7D4;
    --gold:#D3A339;
    --gold-2:#F1C862;
    --rust:#AE3B2A;
    --green:#2E6B4B;
    --ink:#151512;
    --ink-soft:#4A4A45;
    --line:rgba(15,32,56,0.14);
    --display: 'Zilla Slab', serif;
    --body: 'Inter', sans-serif;
    --mono: 'JetBrains Mono', monospace;
    --kn: 'Noto Sans Kannada', 'Inter', sans-serif;
    --radius: 4px;
    --shadow: 0 10px 30px rgba(15,32,56,0.14);
  }
  html[data-lang="kn"] body{ font-family: var(--kn); }
  html[data-lang="kn"] h1, html[data-lang="kn"] h2, html[data-lang="kn"] h3, html[data-lang="kn"] .display{
    font-family: var(--kn);
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family: var(--body);
    line-height:1.55;
    overflow-x:hidden;
  }
  h1,h2,h3,.display{ font-family: var(--display); font-weight:600; color:var(--navy); letter-spacing:-0.01em;}
  a{color:inherit; text-decoration:none;}
  img{max-width:100%; display:block;}
  .container{ max-width:1180px; margin:0 auto; padding:0 24px;}
  .eyebrow{
    font-family:var(--mono); font-size:12px; letter-spacing:.14em; text-transform:uppercase;
    color:var(--rust); font-weight:700; display:flex; align-items:center; gap:10px; margin-bottom:14px;
  }
  .eyebrow::before{content:""; width:26px; height:2px; background:var(--rust); display:inline-block;}
  [data-en],[data-kn]{transition:opacity .15s ease;}
  html[data-lang="en"] [data-kn-only]{display:none !important;}
  html[data-lang="kn"] [data-en-only]{display:none !important;}

  /* ===== SUCCESS BANNER ===== */
  #launchBanner{
    position:relative; z-index:150; background:var(--green); color:#fff;
    overflow:hidden;
  }
  #launchBanner .lb-inner{
    display:flex; align-items:center; justify-content:center; gap:10px;
    padding:10px 20px; text-align:center; font-size:13.5px; font-weight:600;
    flex-wrap:wrap;
  }
  #launchBanner .lb-icon{ font-size:15px; }
  #launchBanner .lb-close{
    position:absolute; right:14px; top:50%; transform:translateY(-50%);
    background:rgba(255,255,255,0.18); border:none; color:#fff; width:22px; height:22px;
    border-radius:50%; cursor:pointer; font-size:13px; line-height:1; display:flex;
    align-items:center; justify-content:center;
  }
  #launchBanner .lb-close:hover{ background:rgba(255,255,255,0.32); }
  #launchBanner.hide{ display:none; }
  @media (max-width:600px){
    #launchBanner .lb-inner{ font-size:12px; padding:9px 40px 9px 14px; }
    #launchBanner .lb-close{ right:10px; }
  }

  /* ===== NAVBAR ===== */
  header{
    position:sticky; top:0; z-index:200;
    background:rgba(245,241,230,0.92);
    backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line);
  }
  .nav-inner{ display:flex; align-items:center; justify-content:space-between; padding:14px 0;}
  .brand{ display:flex; align-items:center; gap:12px;}
  .brand-mark{
    width:44px; height:44px; border-radius:50%; background:var(--navy);
    display:flex; align-items:center; justify-content:center; color:var(--gold-2);
    font-family:var(--display); font-weight:700; font-size:18px; flex-shrink:0;
    border:2px solid var(--gold); overflow:hidden;
  }
  .brand-mark img{ width:100%; height:100%; object-fit:cover;}
  .brand-text{line-height:1.2;}
  .brand-text .en-name{ font-family:var(--display); font-size:17px; font-weight:700; color:var(--navy);}
  .brand-text .sub{ font-family:var(--mono); font-size:10px; letter-spacing:.1em; color:var(--rust); text-transform:uppercase;}
  nav.links{ display:flex; align-items:center; gap:30px;}
  nav.links a{ font-size:14.5px; font-weight:600; color:var(--navy); position:relative; padding:4px 0;}
  nav.links a::after{content:"";position:absolute;left:0;bottom:0;width:0;height:2px;background:var(--rust);transition:width .2s;}
  nav.links a:hover::after{width:100%;}
  .nav-actions{display:flex; align-items:center; gap:12px;}
  .lang-toggle{
    font-family:var(--mono); font-size:12px; font-weight:700; letter-spacing:.05em;
    border:1.5px solid var(--navy); border-radius:20px; overflow:hidden; display:flex; cursor:pointer;
  }
  .lang-toggle span{ padding:7px 13px; transition:.2s;}
  .lang-toggle span.active{ background:var(--navy); color:var(--paper);}
  .btn{
    display:inline-flex; align-items:center; gap:8px; font-weight:700; font-size:14px;
    padding:11px 22px; border-radius:3px; cursor:pointer; border:none; transition:.2s;
    font-family:var(--body);
  }
  .btn-primary{ background:var(--rust); color:#fff;}
  .btn-primary:hover{ background:#8f2e21; transform:translateY(-1px);}
  .btn-outline{ background:transparent; border:1.5px solid var(--navy); color:var(--navy);}
  .btn-outline:hover{ background:var(--navy); color:var(--paper);}
  .btn-gold{ background:var(--gold); color:var(--navy);}
  .btn-gold:hover{ background:var(--gold-2);}
  .hamburger{ display:none; flex-direction:column; gap:5px; cursor:pointer; background:none; border:none;}
  .hamburger span{width:26px;height:2.5px;background:var(--navy);}
  .mobile-menu{ display:none; flex-direction:column; gap:2px; background:var(--paper); border-top:1px solid var(--line);}
  .mobile-menu.open{ display:flex;}
  .mobile-menu a{ padding:14px 24px; border-bottom:1px solid var(--line); font-weight:600; color:var(--navy);}

  /* ===== HERO ===== */
  .hero{
    position:relative; padding:70px 0 90px; overflow:hidden;
    background-color:var(--navy);
    background-image:
      linear-gradient(rgba(10,22,40,0.88), rgba(10,22,40,0.85)),
      url('https://ik.imagekit.io/2bihaekhf/expert%20navodaya/expert%20coaching%20pics/IMG_20260420_072801.jpg.jpeg?updatedAt=1786189705837');
    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;
  }
  .hero::before{
    content:""; position:absolute; inset:0;
    background: radial-gradient(circle at 85% 10%, rgba(211,163,57,0.22), transparent 45%);
    pointer-events:none;
  }
  .hero .container{ position:relative; z-index:1;}
  .hero .hero-eyebrow{ color:var(--gold-2) !important;}
  .hero h1{ color:#fff !important;}
  .hero h1 .accent{ color:var(--gold-2) !important;}
  .hero p.lead{ color:rgba(255,255,255,0.92) !important;}
  .hero .hstat b{ color:#fff !important;}
  .hero .hstat span{ color:rgba(255,255,255,0.75) !important;}
  .hero-grid{ display:grid; grid-template-columns:1.05fr 0.95fr; gap:56px; align-items:center;}
  .hero-eyebrow{ font-family:var(--mono); font-size:12.5px; letter-spacing:.16em; text-transform:uppercase; color:var(--rust); font-weight:700; margin-bottom:18px;}
  .hero h1{ font-size:46px; line-height:1.1; margin-bottom:20px; color:var(--navy);}
  .hero h1 .accent{ color:var(--rust); font-style:italic;}
  .hero p.lead{ font-size:17px; color:var(--ink-soft); max-width:480px; margin-bottom:30px;}
  .hero-ctas{ display:flex; gap:14px; flex-wrap:wrap; margin-bottom:36px;}
  .hero-stats{ display:flex; gap:30px; flex-wrap:wrap;}
  .hstat{ font-family:var(--mono);}
  .hstat b{ display:block; font-size:26px; color:var(--navy); font-family:var(--display);}
  .hstat span{ font-size:11.5px; text-transform:uppercase; letter-spacing:.06em; color:var(--ink-soft);}

  /* Hall-ticket signature element */
  .ticket-wrap{ position:relative; display:flex; justify-content:center; }
  .ticket{
    position:relative; width:100%; max-width:420px; background:#fff;
    border:1.5px dashed var(--navy); border-radius:6px; padding:26px 26px 22px;
    box-shadow:var(--shadow); transform:rotate(2deg);
  }
  .ticket::before, .ticket::after{
    content:""; position:absolute; width:26px; height:26px; background:var(--paper);
    border-radius:50%; border:1.5px dashed var(--navy); top:50%; transform:translateY(-50%);
  }
  .ticket::before{ left:-14px; }
  .ticket::after{ right:-14px; }
  .ticket-head{ display:flex; justify-content:space-between; align-items:flex-start; border-bottom:1.5px solid var(--navy); padding-bottom:12px; margin-bottom:14px;}
  .ticket-head .t-title{ font-family:var(--display); font-weight:700; color:var(--navy); font-size:15px; line-height:1.3;}
  .ticket-stamp{
    font-family:var(--mono); font-size:10px; font-weight:700; color:var(--rust); border:2px solid var(--rust);
    border-radius:50%; width:56px; height:56px; display:flex; align-items:center; justify-content:center;
    text-align:center; transform:rotate(-12deg); line-height:1.15; text-transform:uppercase;
  }
  .ticket-row{ display:flex; justify-content:space-between; padding:8px 0; border-bottom:1px dotted var(--line); font-size:13px;}
  .ticket-row .k{ color:var(--ink-soft); font-family:var(--mono); font-size:11px; text-transform:uppercase; letter-spacing:.04em;}
  .ticket-row .v{ font-weight:700; color:var(--navy); text-align:right;}
  .ticket-foot{ margin-top:16px; display:flex; justify-content:space-between; align-items:center;}
  .ticket-foot .barcode{ display:flex; gap:2px; align-items:flex-end; height:26px;}
  .ticket-foot .barcode i{ display:block; width:2px; background:var(--navy);}
  .ticket-note{ font-family:var(--mono); font-size:10px; color:var(--ink-soft);}

  /* ===== SECTION shared ===== */
  section{ padding:88px 0;}
  .section-head{ max-width:640px; margin-bottom:50px;}
  .section-head h2{ font-size:34px; margin-bottom:14px;}
  .section-head p{ color:var(--ink-soft); font-size:15.5px;}
  .center{ text-align:center; margin-left:auto; margin-right:auto;}

  /* ===== ABOUT ===== */
  .about{
    background:var(--navy); color:var(--paper);
    background-image: repeating-linear-gradient(180deg, transparent, transparent 33px, rgba(245,241,230,0.045) 34px);
  }
  .about .eyebrow{ color:var(--gold-2);}
  .about h2{ color:var(--paper);}
  .about-grid{ display:grid; grid-template-columns:1fr 1fr; gap:60px; align-items:start;}
  .about p{ color:rgba(245,241,230,0.82); font-size:15.5px; margin-bottom:16px;}
  .about-stats{ display:grid; grid-template-columns:1fr 1fr; gap:20px; margin-top:10px;}
  .astat{ border:1px solid rgba(245,241,230,0.2); border-radius:6px; padding:20px;}
  .astat b{ font-family:var(--display); font-size:32px; color:var(--gold-2); display:block;}
  .astat span{ font-size:12.5px; color:rgba(245,241,230,0.72);}

  /* ===== FEATURES ===== */
  .feat-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:24px;}
  .feat-card{
    background:#fff; border:1px solid var(--line); border-radius:6px; padding:28px 24px;
    transition:.2s;
  }
  .feat-card:hover{ transform:translateY(-4px); box-shadow:var(--shadow); border-color:var(--gold);}
  .feat-icon{
    width:48px; height:48px; border-radius:50%; background:var(--paper-2); display:flex; align-items:center;
    justify-content:center; margin-bottom:16px; color:var(--rust);
  }
  .feat-card h3{ font-size:18px; margin-bottom:8px;}
  .feat-card p{ font-size:14px; color:var(--ink-soft);}

  /* ===== COURSES ===== */
  .courses{ background:var(--paper-2);}
  .course-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:24px;}
  .course-card{
    background:#fff; border-radius:6px; overflow:hidden; border:1px solid var(--line); box-shadow:var(--shadow);
  }
  .course-top{ background:var(--navy); color:var(--paper); padding:20px 22px;}
  .course-top .cls{ font-family:var(--mono); font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--gold-2);}
  .course-top h3{ color:#fff; font-size:20px; margin-top:4px;}
  .course-body{ padding:20px 22px;}
  .course-body ul{ list-style:none; margin-bottom:16px;}
  .course-body li{ font-size:13.5px; padding:6px 0; border-bottom:1px dotted var(--line); display:flex; gap:8px;}
  .course-body li::before{ content:"✓"; color:var(--green); font-weight:700;}
  .course-meta{ display:flex; justify-content:space-between; font-family:var(--mono); font-size:11.5px; color:var(--ink-soft); text-transform:uppercase;}

  /* ===== HOSTEL ===== */
  .hostel{ background:var(--green); color:#fff; position:relative; overflow:hidden;}
  .hostel .eyebrow{ color:var(--gold-2);}
  .hostel h2{ color:#fff;}
  .hostel-grid{ display:grid; grid-template-columns:1fr 1fr; gap:50px; align-items:center;}
  .hostel p{ color:rgba(255,255,255,0.88); margin-bottom:16px; font-size:15.5px;}
  .hostel-list{ list-style:none; display:grid; gap:12px; margin:22px 0 28px;}
  .hostel-list li{ display:flex; gap:12px; align-items:flex-start; font-size:14.5px;}
  .hostel-list li::before{ content:"●"; color:var(--gold-2); font-size:9px; margin-top:6px;}
  .hostel-img-frame{
    border:6px solid rgba(255,255,255,0.25); border-radius:6px; overflow:hidden; aspect-ratio:4/3;
    background:linear-gradient(135deg, rgba(255,255,255,0.12), rgba(255,255,255,0.02));
  }
  .hostel-img-frame img{ width:100%; height:100%; object-fit:cover;}

  /* ===== GALLERY ===== */
  .gallery-grid{
    display:grid; grid-template-columns:repeat(4, 1fr); grid-auto-rows:140px; gap:12px;
  }
  .gallery-grid .g-item{ border-radius:6px; overflow:hidden; position:relative; background:var(--paper-2);}
  .gallery-grid .g-item img{ width:100%; height:100%; object-fit:cover; transition:.4s;}
  .gallery-grid .g-item:hover img{ transform:scale(1.08);}
  .gallery-grid .g1{ grid-column:span 2; grid-row:span 2;}
  .gallery-grid .g4{ grid-column:span 2;}
  .g-item .g-tag{
    position:absolute; bottom:0; left:0; right:0; padding:10px 12px; font-size:11.5px; font-weight:700;
    background:linear-gradient(0deg, rgba(15,32,56,0.82), transparent); color:#fff;
  }

  /* ===== SOCIAL SERVICE ===== */
  .social{ background:var(--paper-2);}
  .social-grid{ display:grid; grid-template-columns:1fr 1fr; gap:24px; max-width:900px; margin:0 auto;}
  .social-card{ background:#fff; border-radius:6px; overflow:hidden; border:1px solid var(--line);}
  .social-card .simg{ aspect-ratio:16/10; overflow:hidden; background:var(--paper-2);}
  .social-card .simg img{ width:100%; height:100%; object-fit:cover;}
  .social-card .stext{ padding:18px 20px;}
  .social-card h3{ font-size:16px; margin-bottom:6px;}
  .social-card p{ font-size:13.5px; color:var(--ink-soft);}

  /* ===== TOPPERS ===== */
  .toppers{ background:var(--paper);}
  .topper-grid{ display:grid; grid-template-columns:repeat(2,1fr); gap:24px; max-width:820px; margin:0 auto;}
  .topper-card{
    background:#fff; border:1px solid var(--line); border-radius:8px; overflow:hidden;
    box-shadow:var(--shadow); text-align:center; position:relative;
  }
  .topper-rank{
    position:absolute; top:14px; left:14px; background:var(--gold); color:var(--navy);
    font-family:var(--mono); font-weight:700; font-size:12px; padding:6px 12px; border-radius:20px; z-index:2;
  }
  .topper-photo{ aspect-ratio:1/1; overflow:hidden; background:var(--paper-2);}
  .topper-photo img{ width:100%; height:100%; object-fit:cover;}
  .topper-info{ padding:20px;}
  .topper-info h3{ font-size:18px; margin-bottom:6px;}
  .topper-info .t-school{ font-size:13.5px; color:var(--ink-soft); margin-bottom:8px;}
  .topper-info .t-badge{
    display:inline-block; font-family:var(--mono); font-size:11.5px; font-weight:700; letter-spacing:.03em;
    background:var(--paper-2); color:var(--rust); padding:6px 14px; border-radius:20px; text-transform:uppercase;
  }

  /* ===== TESTIMONIALS ===== */
  .testi-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:24px;}
  .testi-card{ background:#fff; border:1px solid var(--line); border-radius:6px; padding:26px; position:relative;}
  .testi-card .quote-mark{ font-family:var(--display); font-size:44px; color:var(--gold); line-height:1; margin-bottom:6px;}
  .testi-card p.q{ font-size:14.5px; color:var(--ink-soft); margin-bottom:16px;}
  .testi-name{ font-weight:700; color:var(--navy); font-size:14px;}
  .testi-role{ font-family:var(--mono); font-size:11px; color:var(--rust); text-transform:uppercase;}

  /* ===== ADMISSION FORM ===== */

  .admission .eyebrow{ color:var(--gold-2);}
  .admission h2{ color:#fff;}
  .admission-grid{ display:grid; grid-template-columns:0.9fr 1.1fr; gap:56px;}
  .admission p.info{ color:rgba(245,241,230,0.82); margin-bottom:22px; font-size:15px;}
  .quick-contact{ display:flex; flex-direction:column; gap:14px;}
  .qc-item{ display:flex; gap:14px; align-items:center; padding:14px 16px; background:rgba(245,241,230,0.06); border:1px solid rgba(245,241,230,0.16); border-radius:6px;}

  .qc-item span{ font-size:12.5px; color:rgba(245,241,230,0.7);}
  .form-card{ background:#fff; border-radius:8px; padding:32px; box-shadow:var(--shadow);}
  .form-card h3{ font-size:20px; margin-bottom:6px;}
  .form-card p.sub{ font-size:13.5px; color:var(--ink-soft); margin-bottom:20px;}
  .form-grid{ display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-bottom:16px;}
  .form-grid.full{ grid-template-columns:1fr;}

    width:100%; padding:11px 13px; border:1.5px solid var(--line); border-radius:4px; font-family:var(--body);
    font-size:14px; background:var(--paper); color:var(--ink);
  }
  .field textarea{ resize:vertical; min-height:80px;}
  .field input:focus, .field select:focus, .field textarea:focus{ outline:2px solid var(--gold); border-color:var(--gold);}
  .form-submit{ width:100%; justify-content:center; padding:14px; font-size:15px; margin-top:6px;}
  .form-note{ font-size:11.5px; color:var(--ink-soft); margin-top:10px; text-align:center;}

  /* ===== CONTACT / MAP ===== */
  .contact-grid{ display:grid; grid-template-columns:1fr 1fr; gap:50px;}
  .c
